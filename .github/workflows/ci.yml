name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm test
      # the copied registry files in bg-design.json must match the registry's
      # published versions byte for byte
      - name: design registry in sync
        run: pnpm design:check
      - run: pnpm build
      # the bundle must import under plain node: with no env it throws the
      # fail-closed "Invalid environment" error naming variables, nothing else
      - name: bundle loads
        run: |
          set +e
          out=$(env -i PATH="$PATH" node dist/index.js 2>&1)
          echo "$out" | grep -q "Invalid environment:" || { echo "$out"; echo "dist/index.js did not reach the env parse" >&2; exit 1; }
